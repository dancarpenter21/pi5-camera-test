<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Camera Module 3 preview</title>
    <style>
      body { background: #111; color: #f5f5f5; font-family: system-ui, sans-serif; margin: 0; }
      main { margin: 0 auto; max-width: 1280px; padding: 1rem; }
      h1 { font-size: 1.25rem; font-weight: 600; }
      img { background: #222; display: block; height: auto; max-width: 100%; width: 100%; }
      dl { display: grid; gap: .35rem 1rem; grid-template-columns: max-content 1fr; }
      dt { color: #bbb; }
      dd { margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Camera Module 3 live preview</h1>
      <dl aria-label="Camera diagnostics">
        {% for label, value in diagnostics.items() %}
        <dt>{{ label }}</dt><dd>{{ value }}</dd>
        {% endfor %}
      </dl>
      <img src="{{ url_for('stream') }}" alt="Live camera stream">
    </main>
  </body>
</html>
